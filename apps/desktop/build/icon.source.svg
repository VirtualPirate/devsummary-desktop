<!--
  App-icon source art. Not read by electron-builder — build/icon.png is, and that
  file is rendered from this one:

      rsvg-convert -w 1024 -h 1024 apps/desktop/build/icon.source.svg \
        -o apps/desktop/build/icon.png

  electron-builder derives the mac .icns and the Windows .ico from that single PNG,
  so there is nothing else to regenerate when the mark changes.

  Same mark as apps/frontend/public/favicon.svg, re-laid-out for an app icon: the
  824x824 rounded square inset in a 1024 canvas is Apple's macOS grid (100px margin
  on every side), which is what keeps the icon the same visual size as its Dock
  neighbours instead of a full-bleed square that reads oversized.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="DevSummary">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#14181F"/>
  <!-- Maps the favicon's own 0..100 user space onto the 824px tile. -->
  <g transform="translate(100 100) scale(8.24)">
    <g transform="translate(50 50) scale(0.78) translate(-50 -50)">
      <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
        <path d="M18 31 Q37 33 43 47"/>
        <path d="M19 50 L41 50"/>
        <path d="M18 69 Q37 67 43 53"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="15" cy="30" r="4"/>
        <circle cx="15" cy="50" r="4"/>
        <circle cx="15" cy="70" r="4"/>
      </g>
      <circle cx="49" cy="50" r="8" fill="none" stroke="#459FFF" stroke-width="5"/>
      <line x1="57" y1="50" x2="62" y2="50" stroke="#459FFF" stroke-width="4" stroke-linecap="round"/>
      <rect x="63" y="45" width="26" height="10" rx="5" fill="#459FFF"/>
    </g>
  </g>
</svg>
