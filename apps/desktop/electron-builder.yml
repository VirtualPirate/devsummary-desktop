# electron-builder config — docs/MIGRATION-PLAN.md Phase 10.
#
# STATUS: verified on 2026-09-10. `pnpm dist` produces arm64 + x64 dmgs on this Mac,
# and the packaged arm64 app boots: PGlite initializes a fresh cluster in userData,
# all 16 migrations apply, the backend listens on a random loopback port, and the
# renderer completes its startup API calls through the x-desktop-token guard.
# R6 (PGlite sealed in asar) is closed by construction — the backend ships outside
# asar entirely. Still OPEN: R7 (migration-on-upgrade data loss; backend-side, not a
# packaging concern), every non-mac target, and any machine other than the one that
# built it, because nothing is signed (see mac.identity below).

appId: app.devsummary.com
productName: DevSummary
copyright: Copyright DevSummary

# electron-builder defaults its own output directory to "dist", which collides with
# this package's tsc output (apps/desktop/dist/main.js — the `main` entry point, and
# the file main.ts's own relative paths to backend/dist and frontend/dist are resolved
# from). Keep packaged artifacts out of that directory entirely.
directories:
  output: release
  buildResources: build

# No auto-update for v1 (plan §Phase 10). Do not let electron-builder infer a
# publish target from repo metadata either.
publish: null

# ---------------------------------------------------------------------------------
# What ships inside the app.
#
# main.ts resolves its two children by relative path from its own compiled location
# (apps/desktop/dist/main.js):
#   backend:  __dirname/../../backend/dist/main.js
#   frontend: __dirname/../../frontend/dist/index.html
# Packaged, __dirname is `<app>.app/Contents/Resources/app.asar/dist`, so `../../`
# lands in `Contents/Resources` — OUTSIDE the archive. Both children therefore ship
# as extraResources, not as `files` entries: `files` would put them at
# `app.asar/backend/...`, one level too deep, which is exactly how the first real
# `pnpm dist` run failed (ERR_MODULE_NOT_FOUND on backend/dist/main.js, plus
# ERR_FILE_NOT_FOUND on the frontend index.html).
#
# Keeping the backend outside asar is also what makes it *work*, not just resolve:
# it is ESM, and Node's ESM loader does not go through Electron's asar shim the way
# require() does. Same reason PGlite is happy — its .wasm/.data sit on the real
# filesystem here, so no asarUnpack rule is needed any more.
#
# Backend's node_modules is pnpm-managed (symlink forest into a shared content
# store), which electron-builder's own dependency walker does not prune correctly.
# `build/beforePack.js` runs `pnpm --filter backend deploy --legacy --prod` first,
# which materializes a real, non-symlinked, production-only node_modules for the
# backend (workspace deps like @launchstack/core get inlined, not left as symlinks)
# into .backend-deploy/. `--legacy` is required on pnpm v10+, which otherwise
# refuses with ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE.
beforePack: build/beforePack.js

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: .backend-deploy/dist
    to: backend/dist
  - from: .backend-deploy/node_modules
    to: backend/node_modules
  - from: .backend-deploy/package.json
    to: backend/package.json
  - from: ../frontend/dist
    to: frontend/dist

# Data lives in the OS-managed per-user app-data directory, never inside the
# (read-only, wiped-on-update) app bundle. main.ts already passes
# `DATA_DIR: app.getPath('userData')` to the backend at fork time — nothing for
# electron-builder itself to configure here, noted for whoever debugs this next.

# ---------------------------------------------------------------------------------
# FUTURE WORK — vN -> vN+1 migration backup (plan Phase 10, risk R7).
#
# Skipped entirely for this pass (D-D: config sketched, never built or verified).
# The plan requires: before the backend applies migrations on boot, copy the PGlite
# data directory to `data.bak` inside userData; if migration throws, restore
# `data.bak` over the live data dir and refuse to start dirty. This belongs in the
# backend's MigrationRunner (apps/backend/src/databases/kysely/*), not here — it is
# runtime behavior, not a packaging concern — but it is packaging's acceptance gate:
# Phase 10 is not done until an explicit vN -> vN+1 test (install vN, generate data,
# install vN+1 with a new migration, confirm data survives, including the
# failure-restore path) passes. Nobody has written that backup/restore code yet.
# Do not check this box from the packaging side alone.

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Ad-hoc signature. There is no Apple Developer ID in this environment, and
  # `identity: null` (what this config used to say) does not mean "unsigned" in a
  # useful way — it means electron-builder never seals the bundle at all, leaving
  # only the linker-generated ad-hoc signature on Electron's own Mach-O. The result
  # has no Contents/_CodeSignature, so `codesign` reports "code has no resources but
  # signature indicates they must be present" and `spctl -a` exits 1 even before
  # quarantine is involved.
  #
  # "-" makes electron-builder ad-hoc sign the whole bundle, which is well-formed and
  # launches locally. It is NOT a substitute for release signing: an ad-hoc app that
  # arrives with a quarantine bit (i.e. any real download) is still refused, because
  # Gatekeeper wants a Developer ID plus notarization. Swap in the real identity and
  # add notarization before shipping — see docs/RELEASE-CHECKLIST.md §1.
  identity: "-"

win:
  target:
    - target: nsis
      arch: [x64]
  # No code-signing certificate configured. Unsigned nsis installers trigger
  # SmartScreen warnings — acceptable for an unverified v1 sketch, not for release.

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
