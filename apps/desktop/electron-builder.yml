# electron-builder config.
#
# STATUS: verified on 2026-09-10. `pnpm dist` produces arm64 + x64 dmgs on this Mac,
# and the packaged arm64 app boots: PGlite initializes a fresh cluster in userData,
# all 16 migrations apply, the backend listens on a random loopback port, and the
# renderer completes its startup API calls through the x-desktop-token guard.
# R6 (PGlite sealed in asar) is closed by `asarUnpack` below — the backend itself
# now ships *inside* asar, so first-launch Gatekeeper assessment sees one file
# rather than 20k. R7 was closed on 2026-09-17 in the backend (see the note above
# the `mac:` block).
#
# 2026-09-18: every target below now builds on this Mac — the nsis installer too,
# with no wine — and all three layouts pass `test/bundle-shape.js`. The x64 dmg
# and both AppImages have been launched (Rosetta; a container under Xvfb —
# apps/desktop/test/platform/). Still OPEN: Windows, which has never been launched
# at all, native Intel hardware, and any machine other than the one that built
# this, because nothing is signed with a real identity (see mac.identity below).

appId: app.devsummary.com
productName: DevSummary
copyright: Copyright © 2026 Artaza Sameen

# electron-builder defaults its own output directory to "dist", which collides with
# this package's tsc output (apps/desktop/dist/main.js — the `main` entry point, and
# the file main.ts's own relative paths to backend/dist and frontend/dist are resolved
# from). Keep packaged artifacts out of that directory entirely.
directories:
  output: release
  buildResources: build

# The version feed. `releaseType: draft` is the safety property: a tag push
# uploads artifacts and writes latest*.yml, but nothing is live until a
# maintainer publishes the release by hand. Public repo on purpose — a private
# feed needs a token to download assets, and a token inside a distributed binary
# is a published token.
publish:
  provider: github
  owner: VirtualPirate
  repo: devsummary-desktop
  releaseType: draft

# ---------------------------------------------------------------------------------
# What ships inside the app.
#
# main.ts resolves its two children relative to its own compiled location, one
# level up once packaged (`SIBLINGS` in that file):
#   backend:  <app.asar>/backend/dist/main.js
#   frontend: <app.asar>/frontend/dist/index.html
# so both are `files` entries with an explicit from/to, landing inside app.asar
# next to this package's own `dist/`.
#
# Inside the archive, deliberately. An earlier version shipped them as
# extraResources — 20,435 loose backend node_modules files in Contents/Resources —
# and that is what made the first launch after install take *minutes*: Gatekeeper
# assesses every file in a freshly installed bundle, once. Warm launches were
# 9-11 s, so the cost landed entirely on the launch a new user judges the app by.
# One asar is one file to assess.
#
# Everything the backend does at runtime reads through Electron's asar shim, which
# was the open question and is now measured: `utilityProcess.fork` of an entry
# inside the archive, `require` of its node_modules, `fs.readFileSync`, and the
# `worker_threads` Worker that pino's `pino-roll` transport spawns all work. The
# backend boots from asar with all 16 migrations applied and its log file written
# to DATA_DIR. What does *not* work is pnpm's symlinked node_modules layout — see
# build/beforePack.js, which now deploys with a hoisted linker for that reason.
#
# `build/beforePack.js` runs `pnpm --filter backend deploy` first, which
# materializes a real, production-only node_modules for the backend (workspace
# deps like @launchstack/core inlined) into .backend-deploy/.
beforePack: build/beforePack.js

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - from: .backend-deploy/dist
    to: backend/dist
  - from: .backend-deploy/node_modules
    to: backend/node_modules
  - from: .backend-deploy/package.json
    to: backend/package.json
  - from: ../frontend/dist
    to: frontend/dist

# PGlite is the one thing that must stay on the real filesystem: it mmaps its
# .wasm and opens .data directly, neither of which survives asar's read-only
# virtual FS. Three files, unpacked to app.asar.unpacked/ and resolved there
# transparently. The `**/` prefix rather than a hard-coded path so the glob keeps
# matching if the deploy layout changes again.
asarUnpack:
  - "**/node_modules/@electric-sql/pglite/dist/*.wasm"
  - "**/node_modules/@electric-sql/pglite/dist/*.data"

# Legal documents, in Contents/Resources rather than inside asar: the point of
# shipping them is that a user (or a compliance reviewer) can read them without
# unpacking an archive. The app does not read these copies — the consent dialog
# renders LICENSE and PRIVACY.md from the renderer bundle, which imports the same
# two files at build time, so there is one source of truth for both.
#
# THIRD-PARTY-NOTICES.md is regenerated by build/beforePack.js on every package,
# and LICENSES.chromium.html is Chromium's own notices as Electron ships them —
# 20 MB, which is why it is a file next to the app instead of text inside it.
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../PRIVACY.md
    to: PRIVACY.md
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html

# Data lives in the OS-managed per-user app-data directory, never inside the
# (read-only, wiped-on-update) app bundle. main.ts already passes
# `DATA_DIR: app.getPath('userData')` to the backend at fork time — nothing for
# electron-builder itself to configure here, noted for whoever debugs this next.

# vN -> vN+1 migration backup (plan Phase 10, risk R7) — implemented 2026-09-17 in
# apps/backend/src/databases/kysely/kysely.module.ts (`openMigratedDatabase`), not
# here: it is runtime behavior, not a packaging concern. A boot with migrations
# pending against an existing database copies userData/data to userData/data.bak
# before migrating and renames it back if a migration throws. Tested in
# apps/backend/test/e2e/specs/migration-backup.e2e.spec.ts. What packaging still
# owes it is the real thing: install vN, generate data, install vN+1, confirm the
# data survived — apps/desktop/test/packaged-upgrade/driver.mjs does exactly that.

mac:
  # dmg is what a human downloads. zip is what Squirrel.Mac reads — a dmg cannot
  # be auto-installed. Nothing consumes the zip today (mac is notify-only while
  # `identity: "-"` below is ad-hoc, because Squirrel.Mac validates that an
  # update's signature matches the running app's and every ad-hoc build has a
  # different cdhash). It ships anyway so that a real Developer ID turns mac
  # auto-install on with a code flag instead of a packaging change.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Ad-hoc signature. There is no Apple Developer ID in this environment, and
  # `identity: null` (what this config used to say) does not mean "unsigned" in a
  # useful way — it means electron-builder never seals the bundle at all, leaving
  # only the linker-generated ad-hoc signature on Electron's own Mach-O. The result
  # has no Contents/_CodeSignature, so `codesign` reports "code has no resources but
  # signature indicates they must be present" and `spctl -a` exits 1 even before
  # quarantine is involved.
  #
  # "-" makes electron-builder ad-hoc sign the whole bundle, which is well-formed and
  # launches locally. It is NOT a substitute for release signing: an ad-hoc app that
  # arrives with a quarantine bit (i.e. any real download) is still refused, because
  # Gatekeeper wants a Developer ID plus notarization. Swap in the real identity and
  # add notarization before shipping.
  identity: "-"

win:
  target:
    - target: nsis
      arch: [x64]
  # No code-signing certificate configured. Unsigned nsis installers trigger
  # SmartScreen warnings — acceptable for an unverified v1 sketch, not for release.

linux:
  target:
    - target: AppImage
      arch: [x64]
    # x64 only, matching the AppImage. `arch: [x64, arm64]` builds both, but the
    # release job passes --x64 and the apt repo would then advertise an arm64
    # package nothing ever uploads.
    - target: deb
      arch: [x64]
  category: Development
  # fpm refuses to build a deb at all without a maintainer email and a project
  # homepage — the latter reads from apps/desktop/package.json, since this schema
  # has no `homepage` key. executableName is what keeps the installed binary off
  # /usr/bin/desktop: electron-builder derives it from the package's `name`,
  # which PLATFORMS.md called cosmetic under AppImage and is not under apt.
  executableName: devsummary
  maintainer: Artaza Sameen <artaza.developer@gmail.com>
  synopsis: Local-first daily engineering briefs from your GitHub activity

deb:
  # The apt package name. Deb-specific, and does not validate under `linux:`.
  # Defaults to package.json's `name` — "desktop", which is not a name to take
  # onto a public apt repo.
  packageName: devsummary
  # Default is `${name}_${version}_${arch}.deb`, i.e. a filename that disagrees
  # with the package inside it.
  artifactName: devsummary_${version}_${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Same terms the consent dialog shows on first launch, before the install.
  license: ../../LICENSE
